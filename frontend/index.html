<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Preconnect to speed up handshake -->
    <link rel="preconnect" href="https://team-task-manager-ecru-three.vercel.app" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Fast Font Loading -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Team Task Manager | Premium Productivity</title>
  </head>
  <style>
    body { background: #0f172a; margin: 0; }
    .loader-wrapper {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #0f172a; z-index: 9999; transition: opacity 0.5s;
    }
    .loader {
      width: 48px; height: 48px; border: 5px solid #FFF; border-bottom-color: #6366f1;
      border-radius: 50%; display: inline-block; box-sizing: border-box;
      animation: rotation 1s linear infinite;
    }
    @keyframes rotation { 0% { transform: rotate(0deg) } 100% { transform: rotate(360deg) } }
    .fade-out { opacity: 0; pointer-events: none; }
  </style>
  <body>
    <div id="loader-wrapper" class="loader-wrapper">
      <span class="loader"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.getElementById('loader-wrapper').classList.add('fade-out');
        }, 300);
      });
    </script>
  </body>
</html>
